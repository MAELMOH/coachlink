# =============================================================================
# CoachLink — environnement de DÉVELOPPEMENT LOCAL uniquement.
#
# ⚠️  Les identifiants ci-dessous sont des valeurs de développement volontairement
#     triviales et publiques. Ils ne doivent JAMAIS être réutilisés en staging ou
#     en production : là-bas, les secrets viennent du gestionnaire de secrets
#     Scaleway (voir ARCHITECTURE.md §5.1). Aucune donnée personnelle réelle ne
#     doit être chargée dans cet environnement (RGPD — jeux de données fictifs).
#
# Usage :  cp .env.example .env  &&  docker compose up -d
# Services : PostgreSQL 16 · Redis 7 · MinIO (S3-compatible, remplace Scaleway
# Object Storage Paris en local).
# =============================================================================

name: coachlink

services:
  postgres:
    image: postgres:16-alpine
    container_name: coachlink-postgres
    restart: unless-stopped
    environment:
      # Rôle PROPRIÉTAIRE : possède le schéma, exécute les migrations Alembic.
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-coachlink_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-coachlink_owner_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-coachlink}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crée le rôle applicatif NOBYPASSRLS + les extensions, au 1er démarrage.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-coachlink_owner} -d ${POSTGRES_DB:-coachlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coachlink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Substitut local de Scaleway Object Storage (Paris). Même API S3, donc le code
  # backend ne change pas entre le dev et la prod — seule l'endpoint URL diffère.
  minio:
    # Registre officiel MinIO : quay.io (les tags Docker Hub ne sont plus
    # publiés sous `minio/minio`).
    image: quay.io/minio/minio:latest
    container_name: coachlink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-coachlink_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-coachlink_dev_only}
    ports:
      - "${MINIO_PORT:-9000}:9000"      # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Job one-shot : crée les buckets privés attendus par le backend puis s'arrête.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: coachlink-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-coachlink_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-coachlink_dev_only}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-coachlink-media}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-coachlink-exports}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET_MEDIA\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET_EXPORTS\" &&
      mc anonymous set none local/\"$$S3_BUCKET_MEDIA\" &&
      mc anonymous set none local/\"$$S3_BUCKET_EXPORTS\" &&
      echo 'Buckets prets (prives : acces uniquement via URL pre-signee).'
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
