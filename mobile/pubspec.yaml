name: coachlink
description: "CoachLink - mise en relation coach sportif et clients."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (ARCHITECTURE.md 2.1)
  flutter_riverpod: ^2.6.1

  # Navigation + deep links (invitation client)
  go_router: ^15.1.2

  # Reseau
  dio: ^5.11.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7

  # Base locale chiffree (offline-first, C6)
  drift: ^2.23.1
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Secrets device (Keychain iOS / Keystore Android)
  flutter_secure_storage: ^9.2.2

  # Graphiques de progression
  fl_chart: ^0.71.0

  # Temps reel
  web_socket_channel: ^3.0.3

  # Modeles
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Divers
  collection: ^1.18.0
  intl: ^0.19.0
  uuid: ^4.6.0
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.23.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
