[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The URL is NOT set here: it comes from COACHLINK_DATABASE_MIGRATION_URL via
# alembic/env.py. Migrations run as the table OWNER role (coachlink_owner),
# never as the application role (coachlink_app), which must stay NOBYPASSRLS.
version_path_separator = os

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
